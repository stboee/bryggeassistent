  - type: markdown
    title: Ingen template valgt
    content: |
      Faseeditoren er skjult fordi ingen template er valgt. Velg en template i **Start bryggedag**-kortet på fanen **Bryggedag**.
    visibility:
    - condition: state
      entity: sensor.brygging_status
      state: idle
    - condition: state
      entity: sensor.brygging_aktiv_template
      state: Ingen valgt
  - type: markdown
    title: Templateinformasjon utilgjengelig
    content: |
      Faseeditoren er skjult fordi Home Assistant ikke har mottatt aktiv template. Kontroller **Systemkontroll** og **Driftsmeldinger**.
    visibility:
    - condition: state
      entity: sensor.brygging_status
      state: idle
    - condition: state
      entity: sensor.brygging_aktiv_template
      state: unknown
  - type: markdown
    title: Templateinformasjon utilgjengelig
    content: |
      Faseeditoren er skjult fordi Home Assistant-forbindelsen er utilgjengelig. Kontroller **Systemkontroll** og **Driftsmeldinger**.
    visibility:
    - condition: state
      entity: sensor.brygging_status
      state: idle
    - condition: state
      entity: sensor.brygging_aktiv_template
      state: unavailable
  - type: markdown
    title: Faser er låst
    content: |
      {% set s = states('sensor.brygging_status') %}
      {% if s in ['running', 'waiting_confirmation', 'waiting_event', 'paused'] %}Faseeditoren er skjult og sperret mens bryggedagen er aktiv.{% elif s in ['completed', 'ended'] %}Faseeditoren er skjult for å bevare rapportgrunnlaget. Generer rapport og velg deretter **Klargjør ny bryggedag**.{% elif s == 'error' %}Faseeditoren er skjult på grunn av systemfeil. Bruk fanen **Teknisk** for feilsøking.{% else %}Faseeditoren er skjult fordi bryggestatus er `{{ s }}`.{% endif %}
    visibility:
    - condition: state
      entity: sensor.brygging_status
      state_not: idle
- title: Fasepunkter
  path: fasepunkter
  icon: mdi:format-list-checks
  cards:
  - type: vertical-stack
    title: Lagre eller forkast fasepunktendringer
    cards:
    - type: grid
      columns: 2
      square: false
      cards:
      - type: button
        name: Lagre
        icon: mdi:content-save
        tap_action:
          action: call-service
          service: button.press
          target:
            entity_id: button.brygging_lagre_template
      - type: button
        name: Forkast
        icon: mdi:undo-variant
        tap_action:
          action: call-service
          service: button.press
          target:
            entity_id: button.brygging_forkast_templateendringer
          confirmation:
            text: Forkaste alle ulagrede endringer?
    - type: markdown
      content: |
        {% set e = 'sensor.brygging_aktiv_template' %}
        **Valgt template:** {{ states(e) }}  
        **Status:** {{ state_attr(e, 'status') }}  
        **Sist lagret:** {% if state_attr(e, 'saved_at') is none %}Ikke lagret{% else %}{{ state_attr(e, 'saved_at') }}{% endif %}  
        **Ulagrede endringer:** {{ 'Ja' if state_attr(e, 'dirty') else 'Nei' }}  
        {% set errors = state_attr(e, 'validation_errors') %}
        {% set warnings = state_attr(e, 'validation_warnings') %}
        {% if errors %}**Feil:**{% for error in errors %}  
        - {{ error }}{% endfor %}{% endif %}
        {% if warnings %}**Advarsler:**{% for warning in warnings %}  
        - {{ warning }}{% endfor %}{% endif %}
    visibility:
    - condition: state
      entity: sensor.brygging_status
      state: idle
    - condition: state
      entity: sensor.brygging_aktiv_template
      state_not: Ingen valgt
    - condition: state
      entity: sensor.brygging_aktiv_template
      state_not: unknown
    - condition: state
      entity: sensor.brygging_aktiv_template
      state_not: unavailable
