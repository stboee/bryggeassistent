title: Brygging 2026.11.07-1
views:
- title: Bryggedag
  path: bryggedag
  icon: mdi:beer
  cards:
  - type: vertical-stack
    title: Start bryggedag
    cards:
    - type: entities
      show_header_toggle: false
      entities:
      - entity: select.brygging_template
        name: Velg template
      - entity: sensor.brygging_aktiv_template
        name: Lastet template
    - type: grid
      columns: 2
      square: false
      cards:
      - type: button
        name: Start bryggedag
        icon: mdi:play-circle
        tap_action:
          action: call-service
          service: button.press
          target:
            entity_id: button.brygging_start
      - type: button
        name: Oppdater templateliste
        icon: mdi:refresh
        tap_action:
          action: call-service
          service: button.press
          target:
            entity_id: button.brygging_oppdater_templateliste
    - type: markdown
      title: Templatestatus
      content: |
        {% set e = 'sensor.brygging_aktiv_template' %}
        {% if states(e) == 'Ingen valgt' %}_Ingen template er valgt._{% else %}
        **Valgt template:** {{ states(e) }}  
        **Status:** {{ state_attr(e, 'status') }}  
        **Sist lagret:** {% if state_attr(e, 'saved_at') is none %}Ikke lagret{% else %}{{ state_attr(e, 'saved_at') }}{% endif %}  
        **Ulagrede endringer:** {{ 'Ja' if state_attr(e, 'dirty') else 'Nei' }}  
        {% set errors = state_attr(e, 'validation_errors') %}{% set warnings = state_attr(e, 'validation_warnings') %}
        {% if errors %}**Feil:**{% for error in errors %}  
        - {{ error }}{% endfor %}{% endif %}
        {% if warnings %}**Advarsler:**{% for warning in warnings %}  
        - {{ warning }}{% endfor %}{% endif %}{% endif %}
    - type: markdown
      content: |
        Start bruker alltid den **lagrede** versjonen av valgt template og forkaster ulagrede editorendringer.
    - type: vertical-stack
      title: Historisk rapport
      cards:
      - type: entities
        show_header_toggle: false
        entities:
        - entity: select.brygging_historisk_sesjon
          name: Historisk bryggedag
      - type: grid
        columns: 2
        square: false
        cards:
        - type: button
          name: Generer historisk rapport
          icon: mdi:history
          tap_action:
            action: call-service
            service: button.press
            target:
              entity_id: button.brygging_generer_historisk_rapport
        - type: markdown
          content: ' '
      - type: markdown
        title: Siste historiske rapport
        content: |
          {% set e = 'sensor.brygging_rapportarkiv' %}
          {% set f = state_attr(e, 'historical_latest_filename') %}
          {% set u = state_attr(e, 'historical_latest_url') %}
          {% if f is not none and u is not none %}<a href="{{ u }}" target="_blank" rel="noopener noreferrer">Åpne {{ f }}</a>{% else %}_Ingen historisk rapport er publisert ennå._{% endif %}
    visibility:
    - condition: state
      entity: sensor.brygging_status
      state: idle
  - type: markdown
    title: Skjulte bryggedagskort
    content: |
      Tidslinje, fasepunkter og tidsstyring er skjult fordi bryggedagen ikke er startet. Velg en gyldig template og trykk **Start bryggedag**.
    visibility:
    - condition: state
      entity: sensor.brygging_status
      state: idle
  - type: vertical-stack
    title: Tidslinje
    cards:
    - type: grid
      columns: 2
      square: false
      cards:
      - type: button
        name: Neste fase
        icon: mdi:skip-next-circle-outline
        tap_action:
          action: call-service
          service: button.press
          target:
            entity_id: button.brygging_neste_fase
      - type: button
        name: Tilbake
        icon: mdi:arrow-left-bold
        tap_action:
          action: call-service
          service: button.press
          target:
            entity_id: button.brygging_tilbake
          confirmation:
            text: Gå til forrige fase og starte den på nytt?
    - type: markdown
      content: |
        {% set phase = 'sensor.brygging_aktiv_fase' %}
        {% set total = state_attr(phase, 'planned_duration_min') %}
        {% set elapsed = state_attr(phase, 'elapsed_min') %}
        {% set remaining = state_attr(phase, 'remaining_min') %}
        {% set overtime = state_attr(phase, 'overtime_min') %}
        {% set blue = [elapsed, total] | min %}
        {% set row_len = 15 %}
        {% set total_chars = total + overtime %}
        {% set rows = ((total_chars + row_len - 1) // row_len) | int %}
        **Aktiv fase:** {{ states(phase) }}  
        **Fremdrift aktiv fase:** {{ state_attr(phase, 'progress_percent') }} %  
        _{{ blue }} av {{ total }} min{% if overtime > 0 %} + {{ overtime }} min overtid{% endif %}_

        {% for r in range(rows) %}
        {% set start = r * row_len %}
        {% set end = [start + row_len, total_chars] | min %}
        {% for i in range(start, end) %}{% if i < blue %}🟦{% elif i < total %}⬜{% else %}🟩{% endif %}{% endfor %}  
        {% endfor %}
        **Tid brukt:** {{ elapsed }} min · **Tid igjen:** {{ remaining }} min · **Overtid:** {{ overtime }} min

        {% set phases = state_attr('sensor.brygging_faseoversikt', 'phases') %}
        {% for p in phases %}{% if p.status == 'Fullført' %}🟢 {{ p.title }} ({{ p.duration_min }} min){% elif p.status == 'Aktiv' %}🔵 **{{ p.title }} ({{ p.duration_min }} min)**{% else %}⚪ {{ p.title }} ({{ p.duration_min }} min){% endif %}  
        {% endfor %}
    visibility:
    - condition: state
      entity: sensor.brygging_status
      state_not: idle
    - condition: state
      entity: sensor.brygging_status
      state_not: completed
    - condition: state
      entity: sensor.brygging_status
      state_not: ended
    - condition: state
      entity: sensor.brygging_status
      state_not: error
    - condition: state
      entity: sensor.brygging_status
      state_not: unknown
    - condition: state
      entity: sensor.brygging_status
      state_not: unavailable
  - type: vertical-stack
    title: Fasepunkter
    cards:
    - type: grid
      columns: 2
      square: false
      cards:
      - type: button
        name: Bekreft fasepunkt
        icon: mdi:checkbox-marked-outline
        tap_action:
          action: call-service
          service: button.press
          target:
            entity_id: button.brygging_bekreft_fasepunkt
      - type: markdown
        content: |
          {% set e = 'sensor.brygging_neste_fasepunkt' %}
          {% set status = states(e) %}
          {% set confirm = state_attr(e, 'requires_confirmation') == true %}
          {% set overdue = status | lower == 'forfalt' %}
          {% set symbol = '🟥' if overdue and confirm else '🔴' if overdue else '🟦' if confirm else '🔵' %}
          {% set heading = 'Bekreftelsespunkt oversittet' if overdue and confirm else 'Fasepunkt oversittet' if overdue else 'Neste bekreftelsespunkt' if confirm else 'Neste fasepunkt' %}
          # {{ symbol }} {{ state_attr(e, 'time_until_due') }}
          **{{ heading }}**

          {% set name = state_attr(e, 'phasepoint_name') %}{% if name %}{{ name }}{% else %}_Ingen kommende fasepunkter._{% endif %}
    - type: markdown
      content: |
        {% set points = state_attr('sensor.brygging_fasepunktoversikt', 'phasepoints') %}
        {% set next_id = state_attr('sensor.brygging_neste_fasepunkt', 'phasepoint_id') %}
        {% if points is none %}_Fasepunktoversikten er utilgjengelig._{% elif not points %}_Ingen aktive fasepunkter i fasen._{% endif %}
        {% if points is not none %}{% for p in points %}
        {% if p.status == 'Bekreftet' %}{% set symbol = '✅' %}{% elif p.status == 'Passert' %}{% set symbol = '🟢' %}{% elif p.id == next_id and p.requires_confirmation %}{% set symbol = '🟦' %}{% elif p.id == next_id %}{% set symbol = '🔵' %}{% elif p.requires_confirmation %}{% set symbol = '⬜' %}{% else %}{% set symbol = '⚪' %}{% endif %}
        {{ symbol }} {{ p.timing }}: [{{ p.type }}] **{{ p.name }}**{% if p.description %} ({{ p.description }}){% endif %}{% if p.expected_value %} – {{ p.expected_value }}{% endif %}{% if p.requires_confirmation %} – bekreftes{% endif %}{% if p.status == 'Bekreftet' %} – bekreftet{% elif p.status == 'Passert' %} – passert{% elif p.status == 'Forfalt' %} – venter {{ p.time_until_due }}{% else %} – om {{ p.time_until_due }}{% endif %}  
        {% endfor %}{% endif %}
    - type: entities
      show_header_toggle: false
      entities:
      - entity: select.brygging_fasepunkt_for_kommentar
        name: Fasepunkt
      - entity: text.brygging_fasepunktkommentar
        name: Kommentar
    - type: markdown
      title: Sist lagret fasepunktkommentar
      content: |
        {% set e = 'sensor.brygging_siste_fasepunktkommentar' %}
        {% if states(e) == 'Ingen kommentar' %}_Ingen fasepunktkommentar er lagret i denne bryggedagen._{% elif states(e) in ['unknown', 'unavailable'] %}_Kommentarsensoren er utilgjengelig._{% else %}
        **Tid:** {{ states(e) }}  
        **Fase:** {{ state_attr(e, 'phase_title') }}  
        **Fasepunkt:** {{ state_attr(e, 'phasepoint_name') }}  
        **Kommentar:** {{ state_attr(e, 'comment_text') }}
        {% endif %}
    - type: grid
      columns: 2
      square: false
      cards:
      - type: button
        name: Lagre fasepunktkommentar
        icon: mdi:content-save-edit-outline
        tap_action:
          action: call-service
          service: button.press
          target:
            entity_id: button.brygging_lagre_fasepunktkommentar
      - type: markdown
        content: ' '
    visibility:
    - condition: state
      entity: sensor.brygging_status
      state_not: idle
    - condition: state
      entity: sensor.brygging_status
      state_not: completed
    - condition: state
      entity: sensor.brygging_status
      state_not: ended
    - condition: state
      entity: sensor.brygging_status
      state_not: error
    - condition: state
      entity: sensor.brygging_status
      state_not: unknown
    - condition: state
      entity: sensor.brygging_status
      state_not: unavailable
  - type: vertical-stack
    title: Tidsstyring
    cards:
    - type: conditional
      conditions:
      - condition: state
        entity: sensor.brygging_status
        state_not: paused
      card:
        type: grid
        columns: 2
        square: false
        cards:
        - type: button
          name: Pause
          icon: mdi:pause
          tap_action:
            action: call-service
            service: button.press
            target:
              entity_id: button.brygging_pause
        - type: entity
          entity: sensor.brygging_status
          name: Status
          icon: mdi:state-machine
    - type: conditional
      conditions:
      - condition: state
        entity: sensor.brygging_status
        state: paused
      card:
        type: grid
        columns: 2
        square: false
        cards:
        - type: button
          name: Fortsett
          icon: mdi:play-pause
          tap_action:
            action: call-service
            service: button.press
            target:
              entity_id: button.brygging_fortsett
        - type: entity
          entity: sensor.brygging_status
          name: Status
          icon: mdi:state-machine
    - type: entities
      show_header_toggle: false
      entities:
      - entity: sensor.brygging_tid_til_ferdig_bryggedag
        name: Tid til ferdig bryggedag
        icon: mdi:timer-sand
      - entity: sensor.brygging_estimert_ferdig_bryggedag
        name: Estimert ferdig
        icon: mdi:clock-end
    - type: markdown
      title: Aktive timere
      content: |
        {% set timers = state_attr('sensor.brygging_timeroversikt', 'timers') %}
        {% if timers is none %}_Timeroversikten er utilgjengelig._{% elif not timers %}_Ingen timere er aktivert i templaten._{% endif %}
        {% if timers is not none %}{% for t in timers %}{% if t.status == 'Aktiv' %}⏱️{% elif t.status == 'Over tiden' %}🟠{% elif t.status == 'Fullført' %}✅{% else %}⚪{% endif %} **{{ t.name }}:** {{ t.display_text }}  
        {% endfor %}{% endif %}
    - type: markdown
      title: Siste kommando
      content: |
        {% set e = 'sensor.brygging_kommandoresultat' %}
        **Kommando:** {{ state_attr(e, 'command') }}  
        **Resultat:** {{ states(e) }}{% set m = state_attr(e, 'message') %}{% if m %} – {{ m }}{% endif %}  
        **Tid:** {{ state_attr(e, 'processed_at') }}
    - type: markdown
      title: Siste rapport
      content: |
        {% set e = 'sensor.brygging_rapportarkiv' %}
        {% set f = state_attr(e, 'ordinary_latest_filename') %}
        {% set u = state_attr(e, 'ordinary_latest_url') %}
        {% if f is not none and u is not none %}<a href="{{ u }}" target="_blank" rel="noopener noreferrer">Åpne {{ f }}</a>{% else %}_Ingen ordinær rapport er publisert ennå._{% endif %}
    - type: grid
      columns: 2
      square: false
      cards:
      - type: button
        name: Generer rapport
        icon: mdi:file-document-outline
        tap_action:
          action: call-service
          service: button.press
          target:
            entity_id: button.brygging_generer_rapport
      - type: button
        name: Avslutt
        icon: mdi:stop-circle-outline
        tap_action:
          action: call-service
          service: button.press
          target:
            entity_id: button.brygging_avslutt
          confirmation:
            text: Avslutte bryggedagen nå? Sesjonsjournalen forsegles permanent og kan ikke fortsettes. Rapport kan fortsatt genereres før du klargjør en ny bryggedag.
    visibility:
    - condition: state
      entity: sensor.brygging_status
      state_not: idle
    - condition: state
      entity: sensor.brygging_status
      state_not: completed
    - condition: state
      entity: sensor.brygging_status
      state_not: ended
    - condition: state
      entity: sensor.brygging_status
      state_not: error
    - condition: state
      entity: sensor.brygging_status
      state_not: unknown
    - condition: state
      entity: sensor.brygging_status
      state_not: unavailable
  - type: vertical-stack
    title: Bryggedagen er avsluttet
    cards:
    - type: markdown
      title: Skjulte bryggedagskort
      content: |
        Tidslinje, fasepunkter og tidsstyring er skjult fordi bryggedagen er avsluttet. Generer rapport før du velger **Klargjør ny bryggedag**. Sesjonsjournalen og rapportene beholdes.
    - type: entities
      show_header_toggle: false
      entities:
      - entity: sensor.brygging_status
        name: Status
      - entity: sensor.brygging_aktiv_template
        name: Brukt template
    - type: markdown
      title: Siste rapport
      content: |
        {% set e = 'sensor.brygging_rapportarkiv' %}
        {% set f = state_attr(e, 'ordinary_latest_filename') %}
        {% set u = state_attr(e, 'ordinary_latest_url') %}
        {% if f is not none and u is not none %}<a href="{{ u }}" target="_blank" rel="noopener noreferrer">Åpne {{ f }}</a>{% else %}_Ingen ordinær rapport er publisert ennå._{% endif %}
    - type: grid
      columns: 2
      square: false
      cards:
      - type: button
        name: Generer rapport
        icon: mdi:file-document-outline
        tap_action:
          action: call-service
          service: button.press
          target:
            entity_id: button.brygging_generer_rapport
      - type: button
        name: Klargjør ny bryggedag
        icon: mdi:restart
        tap_action:
          action: call-service
          service: button.press
          target:
            entity_id: button.brygging_klargjor_ny_bryggedag
          confirmation:
            text: Klargjøre ny bryggedag? Det genereres først en arkivrapport. Deretter fjernes aktiv sessionpeker, templatevalget nullstilles og status går til idle.
    visibility:
    - condition: state
      entity: sensor.brygging_status
      state_not: idle
    - condition: state
      entity: sensor.brygging_status
      state_not: running
    - condition: state
      entity: sensor.brygging_status
      state_not: waiting_confirmation
    - condition: state
      entity: sensor.brygging_status
      state_not: waiting_event
    - condition: state
      entity: sensor.brygging_status
      state_not: paused
    - condition: state
      entity: sensor.brygging_status
      state_not: error
    - condition: state
      entity: sensor.brygging_status
      state_not: unknown
    - condition: state
      entity: sensor.brygging_status
      state_not: unavailable
  - type: markdown
    title: Bryggedag utilgjengelig
    content: |
      Bryggedagskortene er skjult fordi status er `{{ states('sensor.brygging_status') }}`. Se **Systemkontroll** og **Driftsmeldinger** i fanen **Teknisk**.
    visibility:
    - condition: state
      entity: sensor.brygging_status
      state_not: idle
    - condition: state
      entity: sensor.brygging_status
      state_not: running
    - condition: state
      entity: sensor.brygging_status
      state_not: waiting_confirmation
    - condition: state
      entity: sensor.brygging_status
      state_not: waiting_event
    - condition: state
      entity: sensor.brygging_status
      state_not: paused
    - condition: state
      entity: sensor.brygging_status
      state_not: completed
    - condition: state
      entity: sensor.brygging_status
      state_not: ended
- title: Faser
  path: faser
  icon: mdi:format-list-numbered
  cards:
  - type: vertical-stack
    title: Lagre eller forkast faseendringer
    cards:
    - type: grid
      columns: 2
      square: false
      cards:
      - type: button
        name: Lagre
        icon: mdi:content-save
        tap_action:
          action: call-service
          service: button.press
          target:
            entity_id: button.brygging_lagre_template
      - type: button
        name: Forkast
        icon: mdi:undo-variant
        tap_action:
          action: call-service
          service: button.press
          target:
            entity_id: button.brygging_forkast_templateendringer
          confirmation:
            text: Forkaste alle ulagrede endringer?
    - type: markdown
      content: |
        {% set e = 'sensor.brygging_aktiv_template' %}
        **Valgt template:** {{ states(e) }}  
        **Status:** {{ state_attr(e, 'status') }}  
        **Sist lagret:** {% if state_attr(e, 'saved_at') is none %}Ikke lagret{% else %}{{ state_attr(e, 'saved_at') }}{% endif %}  
        **Ulagrede endringer:** {{ 'Ja' if state_attr(e, 'dirty') else 'Nei' }}  
        {% set errors = state_attr(e, 'validation_errors') %}
        {% set warnings = state_attr(e, 'validation_warnings') %}
        {% if errors %}**Feil:**{% for error in errors %}  
        - {{ error }}{% endfor %}{% endif %}
        {% if warnings %}**Advarsler:**{% for warning in warnings %}  
        - {{ warning }}{% endfor %}{% endif %}
    visibility:
    - condition: state
      entity: sensor.brygging_status
      state: idle
    - condition: state
      entity: sensor.brygging_aktiv_template
      state_not: Ingen valgt
    - condition: state
      entity: sensor.brygging_aktiv_template
      state_not: unknown
    - condition: state
      entity: sensor.brygging_aktiv_template
      state_not: unavailable
  - type: markdown
    title: Fasekonfigurasjon
    content: |
      Navn, varighet, status og kjørerekkefølge lagres i valgt template. **Flytt til plass** omnummererer de andre fasene automatisk. Endringer ligger i arbeidskopien til **Lagre** trykkes.
    visibility:
    - condition: state
      entity: sensor.brygging_status
      state: idle
    - condition: state
      entity: sensor.brygging_aktiv_template
      state_not: Ingen valgt
    - condition: state
      entity: sensor.brygging_aktiv_template
      state_not: unknown
    - condition: state
      entity: sensor.brygging_aktiv_template
      state_not: unavailable
