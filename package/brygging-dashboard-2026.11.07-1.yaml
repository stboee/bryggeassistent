- title: Teknisk
  path: teknisk
  icon: mdi:wrench-cog
  cards:
  - type: markdown
    title: Driftsmeldinger
    content: |
      {% set rows = state_attr('sensor.brygging_driftsmeldinger', 'messages') %}
      {% if rows is none %}_Driftsmeldinger er utilgjengelige._{% elif not rows %}_Ingen aktive driftsmeldinger._{% endif %}
      {% if rows is not none %}{% for row in rows %}{% if row.severity == 'Feil' %}🔴{% else %}🟠{% endif %} **{{ row.source }}:** {{ row.message }}  
      {% endfor %}{% endif %}
  - type: markdown
    title: Systemkontroll
    content: |
      {% set e = 'sensor.brygging_systemkontroll' %}
      {% set raw = state_attr(e, 'checks_json') %}
      {% set checks = raw | from_json %}
      # Systemkontroll

      **Status:** {{ states(e) }}  
      **Bryggestart:** {{ state_attr(e, 'start_summary') }}  
      **Kontrollert:** {{ state_attr(e, 'checked_at') }}  
      **Resultat:** {{ state_attr(e, 'ok_count') }} OK · {{ state_attr(e, 'warning_count') }} advarsler · {{ state_attr(e, 'error_count') }} feil

      {% set ns = namespace(problem_count=0) %}
      {% for c in checks %}{% if c.status in ['Feil', 'Advarsel'] %}{% set ns.problem_count = ns.problem_count + 1 %}{% endif %}{% endfor %}
      {% if ns.problem_count > 0 %}
      ## Feil, advarsler og tiltak
      {% for c in checks %}
      {% if c.status in ['Feil', 'Advarsel'] %}
      ### {{ '❌' if c.status == 'Feil' else '⚠️' }} {{ c.name }}
      **Resultat:** {{ c.result }}  
      **Konklusjon:** {{ c.conclusion }}{% if c.blocks_start %}  
      **Bryggestart:** Sperret{% endif %}{% if c.remediation %}  
      **Tiltak:** {{ c.remediation }}{% endif %}

      {% endif %}
      {% endfor %}
      {% endif %}
      ## Utførte kontroller
      {% set group = namespace(value='') %}
      {% for c in checks %}
      {% if c.group != group.value %}{% set group.value = c.group %}
      ### {{ c.group }}
      {% endif %}
      {{ '✅' if c.status == 'OK' else '❌' if c.status == 'Feil' else '⚠️' if c.status == 'Advarsel' else 'ℹ️' }} **{{ c.name }}** — {{ c.status }}  
      **Test:** {{ c.method }}  
      **Mål:** `{{ c.target }}`  
      **Resultat:** {{ c.result }}  
      **Konklusjon:** {{ c.conclusion }}

      {% endfor %}
      {% if checks | length == 0 %}
      Ingen detaljerte testresultater er mottatt ennå. Trykk **Oppdater systemkontroll**.
      {% endif %}
  - type: markdown
    title: Rapportarkiv
    content: |
      {% set e = 'sensor.brygging_rapportarkiv' %}
      **Totalt:** {{ state_attr(e, 'total_count') }} rapporter · {{ state_attr(e, 'total_size') }}  
      **Ordinære:** {{ state_attr(e, 'ordinary_count') }}  
      **Historiske:** {{ state_attr(e, 'historical_count') }}

      {% set ordinary = state_attr(e, 'ordinary_latest_filename') %}{% set ordinary_url = state_attr(e, 'ordinary_latest_url') %}
      **Siste ordinære rapport:** {% if ordinary is not none %}<a href="{{ ordinary_url }}" target="_blank" rel="noopener noreferrer">{{ ordinary }}</a>{% else %}Ingen rapport{% endif %}  
      **Publisert kopi:** {% if state_attr(e, 'ordinary_public_copy_ok') is none %}Ingen rapport{% elif state_attr(e, 'ordinary_public_copy_ok') %}OK{% else %}FEIL{% endif %}

      {% set historical = state_attr(e, 'historical_latest_filename') %}{% set historical_url = state_attr(e, 'historical_latest_url') %}
      **Siste historiske rapport:** {% if historical is not none %}<a href="{{ historical_url }}" target="_blank" rel="noopener noreferrer">{{ historical }}</a>{% else %}Ingen rapport{% endif %}  
      **Publisert historisk kopi:** {% if state_attr(e, 'historical_public_copy_ok') is none %}Ingen rapport{% elif state_attr(e, 'historical_public_copy_ok') %}OK{% else %}FEIL{% endif %}
  - type: markdown
    title: Sesjonsarkiv
    content: |
      {% set e = 'sensor.brygging_sesjonsarkiv' %}
      **Totalt:** {{ state_attr(e, 'total_count') }} sesjoner · {{ state_attr(e, 'total_size') }}  
      🔵 **Pågående:** {{ state_attr(e, 'active_count') }}  
      🟢 **Normalt fullført:** {{ state_attr(e, 'completed_count') }}  
      🟡 **Manuelt avsluttet:** {{ state_attr(e, 'ended_count') }}  
      🟠 **Ufullført:** {{ state_attr(e, 'unfinished_count') }}  
      ⚪ **Uklassifisert:** {{ state_attr(e, 'unclassified_count') }}
  - type: grid
    columns: 2
    square: false
    cards:
    - type: button
      name: Oppdater systemkontroll
      icon: mdi:refresh
      tap_action:
        action: call-service
        service: button.press
        target:
          entity_id: button.brygging_oppdater_systemkontroll
    - type: button
      name: Behold siste 100 rapporter
      icon: mdi:archive-arrow-down
      tap_action:
        action: call-service
        service: button.press
        target:
          entity_id: button.brygging_behold_siste_100_rapporter
        confirmation:
          text: Slette alle rapporter unntatt de 100 nyeste? Dette kan ikke angres.
  - type: conditional
    conditions:
    - condition: state
      entity: sensor.brygging_status
      state: error
    card:
      type: grid
      columns: 2
      square: false
      cards:
      - type: button
        name: Nødavslutt bryggedag
        icon: mdi:alert-octagon
        tap_action:
          action: call-service
          service: button.press
          target:
            entity_id: button.brygging_nodavslutt_ved_systemfeil
          confirmation:
            text: Nødavslutte sesjonen? Systemet forsøker å lage en gjenopprettingsrapport, fjerner koblingen til den aktive sesjonen og går til idle. Sesjonen kan ikke fortsettes og beholdes som Ufullført.
      - type: markdown
        content: ' '
