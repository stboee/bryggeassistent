      name: Flytt til plass
      icon: mdi:sort-numeric-ascending
    visibility:
    - condition: state
      entity: sensor.brygging_status
      state: idle
    - condition: state
      entity: sensor.brygging_aktiv_template
      state_not: Ingen valgt
