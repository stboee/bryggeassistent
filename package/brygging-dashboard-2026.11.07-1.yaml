- title: Timere
  path: timere
  icon: mdi:timer-cog-outline
  cards:
  - type: vertical-stack
    title: Lagre eller forkast timerendringer
    cards:
    - type: grid
      columns: 2
      square: false
      cards:
      - type: button
        name: Lagre
        icon: mdi:content-save
        tap_action:
          action: call-service
          service: button.press
          target:
            entity_id: button.brygging_lagre_template
      - type: button
        name: Forkast
        icon: mdi:undo-variant
        tap_action:
          action: call-service
          service: button.press
          target:
            entity_id: button.brygging_forkast_templateendringer
          confirmation:
            text: Forkaste alle ulagrede endringer?
    - type: markdown
      content: |
        {% set e = 'sensor.brygging_aktiv_template' %}
        **Valgt template:** {{ states(e) }}  
        **Status:** {{ state_attr(e, 'status') }}  
        **Sist lagret:** {% if state_attr(e, 'saved_at') is none %}Ikke lagret{% else %}{{ state_attr(e, 'saved_at') }}{% endif %}  
        **Ulagrede endringer:** {{ 'Ja' if state_attr(e, 'dirty') else 'Nei' }}  
        {% set errors = state_attr(e, 'validation_errors') %}
        {% set warnings = state_attr(e, 'validation_warnings') %}
        {% if errors %}**Feil:**{% for error in errors %}  
        - {{ error }}{% endfor %}{% endif %}
        {% if warnings %}**Advarsler:**{% for warning in warnings %}  
        - {{ warning }}{% endfor %}{% endif %}
    visibility:
    - condition: state
      entity: sensor.brygging_status
      state: idle
    - condition: state
      entity: sensor.brygging_aktiv_template
      state_not: Ingen valgt
    - condition: state
      entity: sensor.brygging_aktiv_template
      state_not: unknown
    - condition: state
      entity: sensor.brygging_aktiv_template
      state_not: unavailable
  - type: vertical-stack
    title: Hendelser
    cards:
    - type: markdown
      content: |
        Konfigurer inntil 15 templatebaserte timere. Start bestemmer når timeren aktiveres; slutt bestemmer mål eller stopp.

        **Plantid:** beregnet tidspunkt fra templaten. **Løpende:** oppdatert beregning som følger fremdrift og pause. **Faktisk:** finnes først når starten eller slutten virkelig har skjedd. **Passert:** fasepunktets plantid er nådd. **Bekreftet:** fasepunktet er kvittert manuelt.

        For en nedtelling til et framtidig punkt, bruk normalt *Plantid* eller *Løpende* som slutthendelse. Velger du *Faktisk* eller *Bekreftet* som slutt, blir resultatet først kjent etter hendelsen. **Tell ned** viser tiden fram til sluttmålet; **Tell opp** viser tiden siden start. Positiv forskyvning er etter hendelsen; negativ er før.
    - type: entities
      show_header_toggle: false
      entities:
      - entity: select.brygging_rediger_timer
        name: Timerplass
      - entity: select.brygging_timer_status
        name: Status
      - entity: text.brygging_timer_navn
        name: Tekst
      - entity: number.brygging_timer_rekkefolge
        name: Rekkefølge
      - entity: select.brygging_timer_retning
        name: Retning
      - entity: select.brygging_timer_pauseoppforsel
        name: Pauseoppførsel
      - entity: select.brygging_timer_start_hendelse
        name: Starthendelse
      - entity: select.brygging_timer_start_referanse
        name: Startreferanse
      - entity: number.brygging_timer_start_offset_min
        name: Startforskyvning
      - entity: select.brygging_timer_slutt_hendelse
        name: Slutthendelse
      - entity: select.brygging_timer_slutt_referanse
        name: Sluttreferanse
      - entity: number.brygging_timer_slutt_offset_min
        name: Sluttforskyvning
    visibility:
    - condition: state
      entity: sensor.brygging_status
      state: idle
    - condition: state
      entity: sensor.brygging_aktiv_template
      state_not: Ingen valgt
    - condition: state
      entity: sensor.brygging_aktiv_template
      state_not: unknown
    - condition: state
      entity: sensor.brygging_aktiv_template
      state_not: unavailable
  - type: markdown
    title: Ingen template valgt
    content: |
      Timereditoren er skjult fordi ingen template er valgt. Velg en template i **Start bryggedag**-kortet på fanen **Bryggedag**.
    visibility:
    - condition: state
